name: FosCode Verification

on:
  push:
    branches: [v1.2.21]
    paths:
      - "packages/opencode/src/agent/**"
      - "packages/opencode/src/license/**"
      - "packages/opencode/test/verify/**"
  pull_request:
    branches: [v1.2.21]
    paths:
      - "packages/opencode/src/agent/**"
      - "packages/opencode/src/license/**"
      - "packages/opencode/test/verify/**"

jobs:
  verify:
    name: FosCode Permission & Functional Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run permission verification tests
        run: |
          cd packages/opencode
          bun test test/verify/permission --timeout 30000

      - name: Run functional verification tests
        run: |
          cd packages/opencode
          bun test test/verify/functional --timeout 30000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foscode-test-results
          path: packages/opencode/test/verify/**/*.result
          retention-days: 30

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun turbo typecheck

  lint:
    name: Code Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run format check
        run: bun turbo format --check

      - name: Run lint
        run: bun turbo lint
