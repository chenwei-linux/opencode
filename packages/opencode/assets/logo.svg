<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Terminal symbol -->
  <rect x="45" y="50" width="110" height="90" rx="8" ry="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  
  <!-- Terminal header -->
  <rect x="45" y="50" width="110" height="20" rx="8" ry="0" fill="#212529"/>
  <circle cx="60" cy="60" r="5" fill="#ff5f57"/>
  <circle cx="75" cy="60" r="5" fill="#ffbd2e"/>
  <circle cx="90" cy="60" r="5" fill="#28c940"/>
  
  <!-- Terminal content lines -->
  <rect x="55" y="80" width="60" height="6" rx="3" fill="#58a6ff"/>
  <rect x="55" y="95" width="80" height="6" rx="3" fill="#8b949e"/>
  <rect x="55" y="110" width="50" height="6" rx="3" fill="#8b949e"/>
  
  <!-- Prompt symbol -->
  <text x="55" y="130" font-family="monospace" font-size="14" fill="#7ee787">$</text>
  
  <!-- Ops/Sysadmin icon -->
  <path d="M100 145 L85 170 H115 Z" fill="url(#text)" opacity="0.9"/>
  <circle cx="100" cy="142" r="8" fill="url(#text)" opacity="0.9"/>
  
  <!-- Text: FosCode -->
  <text x="100" y="188" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#text)" text-anchor="middle">FosCode</text>
</svg>
